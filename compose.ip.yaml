services:
  db:
    image: ${MYSQL_IMAGE:-mysql:8.4}
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: inductor_scheduler
      MYSQL_USER: inductor
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uinductor", "-p$${MYSQL_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  app:
    build:
      context: .
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:24-alpine}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: mysql://inductor:${MYSQL_PASSWORD}@db:3306/inductor_scheduler
      BOOTSTRAP_PASSWORD: ${BOOTSTRAP_PASSWORD:?set BOOTSTRAP_PASSWORD}
      GUOXUAN_BOOTSTRAP_PASSWORD: ${GUOXUAN_BOOTSTRAP_PASSWORD:?set GUOXUAN_BOOTSTRAP_PASSWORD}
      COOKIE_SECURE: "false"
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      - db
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s

volumes:
  db-data:
